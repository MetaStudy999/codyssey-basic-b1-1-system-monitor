name: One-shot B1-1 terminology alignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-b1-1-terminology.yml'

permissions:
  contents: write

jobs:
  patch-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Korean-first terminology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('training/round-01-clear/BEGINNER-GUIDE.md')
          expected_blob = '179743b3923c76648548e4f342867d0d87e0e77c'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'BEGINNER-GUIDE.md drift: expected {expected_blob}, got {actual_blob}')

          text = path.read_text(encoding='utf-8')
          replacements = [
              ('# B1-1 Round 01 — Beginner Guide', '# B1-1 훈련 차수(Round) 01 — 입문자 가이드(Beginner Guide)'),
              ('이 문서는 B1-1을 처음 수행하는 입문자가 공식 Mission/Evaluation을 기준으로 처음부터 끝까지 재현하기 위한 중심 가이드입니다.', '이 문서는 B1-1을 처음 수행하는 입문자가 공식 미션(Mission)/평가(Evaluation)를 기준으로 처음부터 끝까지 재현하기 위한 중심 가이드입니다.'),
              ('> 현재 훈련 차수는 **R01 — CLEAR**이며, Control Tower의 현재 운영 기준은 **Phase C — FAST EXECUTE / Runtime**입니다. Phase A/B의 Reference·설계 준비는 완료된 상태로 보고, 지금은 실제 Ubuntu Runtime → Verify → Evidence → CLEAR를 우선합니다. 실제 실행하지 않은 항목은 PASS/CLEAR로 기록하지 않습니다.', '> 현재 훈련 차수는 **R01 — CLEAR**이며, Control Tower의 현재 운영 기준은 **Phase C — 빠른 실행 방식(FAST EXECUTE) / 실제 실행(Runtime)**입니다. Phase A/B의 기준 구현(Reference Build)·설계 준비는 완료된 상태로 보고, 지금은 Ubuntu 실제 실행(Runtime) → 검증(Verification) → 증빙 자료(Evidence) → 완료(CLEAR)를 우선합니다. 실제 실행하지 않은 항목은 PASS/CLEAR로 기록하지 않습니다.'),
              ('Quick Start를 실행하기 전에 Control Tower에서 다음 순서를 먼저 닫습니다.', '빠른 시작(Quick Start)을 실행하기 전에 Control Tower에서 다음 순서를 먼저 닫습니다.'),
              ('4. 그 다음 B1-1 Quick Start → STEP 01', '4. 그 다음 B1-1 빠른 시작(Quick Start) → STEP 01'),
              ('   → B1-1 Repository Root로 이동합니다.', '   → B1-1 저장소 루트(Repository Root)로 이동합니다.'),
              ('   → 현재 작업 Branch를 확인합니다.', '   → 현재 작업 브랜치(Branch)를 확인합니다.'),
              ('   → 제공 Agent 실행 파일 선택에 필요한 CPU Architecture를 확인합니다.', '   → 제공 Agent 실행 파일 선택에 필요한 CPU 아키텍처(Architecture)를 확인합니다.'),
              ('   → PID 1을 확인하여 systemd 기반 Runtime인지 판단합니다.', '   → PID 1을 확인하여 systemd 기반 실행 환경(Runtime)인지 판단합니다.'),
              ('### Quick Start 정상 기준', '### 빠른 시작(Quick Start) 정상 기준'),
              ('[ ] Ubuntu 24.04 Runtime이다.', '[ ] Ubuntu 24.04 실행 환경(Runtime)이다.'),
              ('[ ] CPU Architecture를 확인했다.', '[ ] CPU 아키텍처(Architecture)를 확인했다.'),
              ('→ 공통 환경 동결이 확인되고 위 항목을 모두 만족하면 STEP 01부터 현재 실제 Runtime 상태를 확인합니다.', '→ 공통 환경 동결이 확인되고 위 항목을 모두 만족하면 STEP 01부터 현재 실제 실행(Runtime) 상태를 확인합니다.'),
              ('→ Control Tower 환경 Gate 또는 개발환경·Repository 위치·Branch·Runtime부터 먼저 바로잡습니다.', '→ Control Tower 환경 판정(Gate) 또는 개발환경·저장소(Repository) 위치·브랜치(Branch)·실행 환경(Runtime)부터 먼저 바로잡습니다.'),
              ('> Quick Start에서는 SSH, UFW, 사용자, ACL, Agent, cron 설정을 자동 변경하지 않습니다.', '> 빠른 시작(Quick Start)에서는 SSH, UFW, 사용자, ACL, Agent, cron 설정을 자동 변경하지 않습니다.'),
              ('- [01. Source of Truth](#source-of-truth)', '- [01. 공식 기준(Source of Truth)](#source-of-truth)'),
              ('- [03. R01 Runtime Path](#runtime-path)', '- [03. R01 실제 실행 경로(Runtime Path)](#runtime-path)'),
              ('- [STEP 01 — 현재 실행 환경 Baseline 확인](#step-01)', '- [STEP 01 — 현재 실행 환경 기준 상태(Baseline) 확인](#step-01)'),
              ('- [STEP 02 — Golden Path와 필수 도구 준비](#step-02)', '- [STEP 02 — 표준 실행 경로(Golden Path)와 필수 도구 준비](#step-02)'),
              ('- [STEP 06 — Agent archive·환경변수·Secret 준비](#step-06)', '- [STEP 06 — Agent 압축 파일(Archive)·환경 변수(Environment Variable)·비밀정보(Secret) 준비](#step-06)'),
              ('- [STEP 11 — 실패 경로와 Warning 경로 검증](#step-11)', '- [STEP 11 — 실패 경로와 경고(Warning) 경로 검증](#step-11)'),
              ('- [STEP 12 — 통합 verify.sh 실행](#step-12)', '- [STEP 12 — 통합 `verify.sh` 검증(Verification)](#step-12)'),
              ('- [STEP 13 — Evidence 정리](#step-13)', '- [STEP 13 — 실제 증빙 자료(Evidence) 수집·검토·연결](#step-13)'),
              ('- [STEP 14 — Evaluation Q&A 학습](#step-14)', '- [STEP 14 — 평가 질의응답(Evaluation Q&A) 학습·모의 설명](#step-14)'),
              ('- [STEP 15 — B1-1 CLEAR Gate](#step-15)', '- [STEP 15 — B1-1 최종 미션 완료(CLEAR) Gate](#step-15)'),
              ('- [Reference 보조 파일](#reference-files)', '- [기준 구현(Reference) 보조 파일](#reference-files)'),
              ('- [Secret 원칙](#secret-policy)', '- [비밀정보(Secret) 원칙](#secret-policy)'),
              ('- Runtime 상태: **🟡 ACTIVE**', '- 실행 환경(Runtime) 상태: **🟡 ACTIVE**'),
              ('- 현재 운영 모드: **Phase C — FAST EXECUTE / Runtime**', '- 현재 운영 모드: **Phase C — 빠른 실행 방식(FAST EXECUTE) / 실제 실행(Runtime)**'),
              ('- Primary R01 Golden Path:', '- R01 기본 표준 실행 경로(Primary Golden Path):'),
              ('- Secondary Check:', '- 보조 확인(Secondary Check):'),
              ('- Docker: **선택 Lab**이며 B1-1 CLEAR의 기본 선행조건이 아님', '- Docker: **선택 실습(Lab)**이며 B1-1 완료(CLEAR)의 기본 선행조건이 아님'),
              ('공식 평가항목을 Evidence로 증명합니다.', '공식 평가항목을 증빙 자료(Evidence)로 증명합니다.'),
              ('공식 Mission은 `$AGENT_HOME`의 예시 경로를 제시하지만 고정 경로로 요구하지 않습니다.', '공식 미션(Mission)은 `$AGENT_HOME`의 예시 경로를 제시하지만 고정 경로로 요구하지 않습니다.'),
              ('## 01. Source of Truth', '## 01. 공식 기준(Source of Truth)'),
              ('5. 이번 Round의 실제 Runtime 결과와 Evidence', '5. 이번 훈련 차수(Round)의 실제 실행(Runtime) 결과와 증빙 자료(Evidence)'),
              ('6. 제공 Agent 앱의 Boot Sequence 5단계 `[OK]`, `Agent READY`, `0.0.0.0:15034` LISTEN', '6. 제공 Agent 앱의 부팅 순서(Boot Sequence) 5단계 `[OK]`, `Agent READY`, `0.0.0.0:15034` LISTEN'),
              ('8. Process/Port Health Check와 실패 시 `exit 1`', '8. 프로세스/포트 상태 점검(Process/Port Health Check)과 실패 시 `exit 1`'),
              ('9. CPU/MEM/DISK 수집과 Warning', '9. CPU/MEM/DISK 수집과 경고(Warning)'),
              ('13. Requirement → Implementation → Verification → Evidence 연결', '13. 요구사항(Requirement) → 구현(Implementation) → 검증(Verification) → 증빙 자료(Evidence) 연결'),
              ('## 03. R01 Runtime Path', '## 03. R01 실제 실행 경로(Runtime Path)'),
              ('# STEP 01 — 현재 실행 환경 Baseline 확인', '# STEP 01 — 현재 실행 환경 기준 상태(Baseline) 확인'),
              ('- **기준 상태 (Baseline)**', '- **기준 상태(Baseline)**'),
              ('- **아키텍처 (Architecture)**', '- **아키텍처(Architecture)**'),
              ('- **초기화 시스템 (Init system / systemd)**', '- **초기화 시스템(Init system / systemd)**'),
              ('- **리슨 (Listen)**', '- **리슨(Listen)**'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training/round-01-clear/BEGINNER-GUIDE.md
          git rm .github/workflows/_oneshot-b1-1-terminology.yml
          git commit -m 'docs: align B1-1 guide terminology Korean-first'
          git push origin HEAD:main
