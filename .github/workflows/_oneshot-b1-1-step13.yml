name: One-shot B1-1 STEP13 patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-b1-1-step13.yml'

permissions:
  contents: write

jobs:
  patch-step13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch BEGINNER-GUIDE STEP13 only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          guide = Path("training/round-01-clear/BEGINNER-GUIDE.md")
          source = Path(".github/step13-content.md")
          text = guide.read_text(encoding="utf-8")
          step13 = source.read_text(encoding="utf-8").rstrip()

          start_marker = '<a id="step-13"></a>'
          end_marker = '<a id="step-14"></a>'

          if text.count(start_marker) != 1:
              raise SystemExit("STEP13 marker count is not exactly one")
          if text.count(end_marker) != 1:
              raise SystemExit("STEP14 marker count is not exactly one")

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_text = text[:start] + step13 + "\n\n---\n\n" + text[end:]

          if new_text.count(start_marker) != 1 or new_text.count(end_marker) != 1:
              raise SystemExit("marker validation failed after replacement")

          with guide.open("w", encoding="utf-8", newline="\n") as f:
              f.write(new_text)
          PY

          git diff --check
          test "$(git diff --name-only)" = "training/round-01-clear/BEGINNER-GUIDE.md"

      - name: Remove one-shot files and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/step13-content.md .github/workflows/_oneshot-b1-1-step13.yml
          git add training/round-01-clear/BEGINNER-GUIDE.md
          git diff --cached --check
          git commit -m "docs: harden B1-1 STEP 13 evidence collection and traceability"
          git push origin HEAD:main
