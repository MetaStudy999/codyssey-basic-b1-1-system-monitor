name: B1-1 New Baseline Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime tools used by monitor contract
        run: sudo apt-get update && sudo apt-get install -y iproute2 procps
      - name: Run focused static contract
        run: bash tests/new-baseline-static.sh
      - name: Run monitor behavioral regression cases
        run: bash tests/new-baseline-monitor-behavior.sh
