name: One-shot split B1-1 module 07

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-split-b1-1-module-07.yml'

permissions:
  contents: write

jobs:
  split-module-07:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split module 07 into learning units
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('training/round-01-clear/guide')
          src_path = root / '07-VERIFICATION-AND-EVIDENCE.md'
          module_dir = root / '07-verification-evidence'
          readme_path = module_dir / 'README.md'

          text = src_path.read_text(encoding='utf-8')
          m12 = '<a id="step-12"></a>'
          m13 = '<a id="step-13"></a>'
          m14 = '<a id="step-14"></a>'

          for marker in (m12, m13, m14):
              if text.count(marker) != 1:
                  raise SystemExit(f'[FAIL] marker count for {marker}: {text.count(marker)}')

          i12 = text.index(m12)
          i13 = text.index(m13)
          i14 = text.index(m14)
          if not (i12 < i13 < i14):
              raise SystemExit('[FAIL] STEP marker order is invalid')

          step12 = text[i12:i13].rstrip('\n- ') + '\n'
          step13 = text[i13:i14].rstrip('\n- ') + '\n'
          step14_tail = text[i14:]

          nav_marker = '\n---\n\n## 다음 이동'
          if nav_marker in step14_tail:
              step14 = step14_tail.split(nav_marker, 1)[0].rstrip() + '\n'
          else:
              step14 = step14_tail.rstrip() + '\n'

          docs = {
              module_dir / '01-verification.md': (
                  '# B1-1 모듈 07 — STEP 12 통합 검증(Integrated Verification)\n\n'
                  '> [← 모듈 07 목차](README.md) · [다음: STEP 13 →](02-evidence.md) · [전체 입문자 가이드](../../BEGINNER-GUIDE.md)\n\n'
                  + step12 +
                  '\n---\n\n[← 모듈 07 목차](README.md) · [다음: STEP 13 →](02-evidence.md) · [전체 입문자 가이드](../../BEGINNER-GUIDE.md)\n'
              ),
              module_dir / '02-evidence.md': (
                  '# B1-1 모듈 07 — STEP 13 증빙 자료(Evidence)\n\n'
                  '> [← STEP 12](01-verification.md) · [모듈 07 목차](README.md) · [다음: STEP 14 →](03-evaluation-qa.md)\n\n'
                  + step13 +
                  '\n---\n\n[← STEP 12](01-verification.md) · [모듈 07 목차](README.md) · [다음: STEP 14 →](03-evaluation-qa.md)\n'
              ),
              module_dir / '03-evaluation-qa.md': (
                  '# B1-1 모듈 07 — STEP 14 평가 질의응답(Evaluation Q&A)\n\n'
                  '> [← STEP 13](02-evidence.md) · [모듈 07 목차](README.md) · [다음: 모듈 08 →](../08-final-clear/README.md)\n\n'
                  + step14 +
                  '\n---\n\n[← STEP 13](02-evidence.md) · [모듈 07 목차](README.md) · [다음: 모듈 08 →](../08-final-clear/README.md)\n'
              ),
          }

          module_dir.mkdir(parents=True, exist_ok=True)
          for path, content in docs.items():
              path.write_text(content, encoding='utf-8')

          if docs[module_dir / '01-verification.md'].count(step12) != 1:
              raise SystemExit('[FAIL] STEP 12 preservation check')
          if docs[module_dir / '02-evidence.md'].count(step13) != 1:
              raise SystemExit('[FAIL] STEP 13 preservation check')
          if docs[module_dir / '03-evaluation-qa.md'].count(step14) != 1:
              raise SystemExit('[FAIL] STEP 14 preservation check')

          readme = readme_path.read_text(encoding='utf-8')
          replacements = {
              '../07-VERIFICATION-AND-EVIDENCE.md#step-12': '01-verification.md',
              '../07-VERIFICATION-AND-EVIDENCE.md#step-13': '02-evidence.md',
              '../07-VERIFICATION-AND-EVIDENCE.md#step-14': '03-evaluation-qa.md',
          }
          for old, new in replacements.items():
              if old not in readme:
                  raise SystemExit(f'[FAIL] README link not found: {old}')
              readme = readme.replace(old, new)
          readme_path.write_text(readme, encoding='utf-8')

          compatibility = '''# B1-1 모듈 07 — 이전 경로 호환 안내

이 파일은 B1-1 입문자 가이드의 **3계층 정보 구조(Information Architecture, IA)** 전환 과정에서 기존 링크가 즉시 끊기지 않도록 남겨 둔 호환 경로입니다.

현재 학습 본문의 단일 기준(Source of Truth)은 다음 모듈 목차와 세부 학습 문서입니다.

- [모듈 07 — 검증(Verification)·증빙 자료(Evidence)·평가 설명](07-verification-evidence/README.md)
- [STEP 12 — 통합 검증(Integrated Verification)](07-verification-evidence/01-verification.md)
- [STEP 13 — 증빙 자료(Evidence) 수집·검토·연결](07-verification-evidence/02-evidence.md)
- [STEP 14 — 평가 질의응답(Evaluation Q&A)](07-verification-evidence/03-evaluation-qa.md)

> 이 호환 파일에는 상세 명령·설명·검증 내용을 중복하지 않습니다. 새 학습 경로를 사용하세요.

[← 전체 입문자 가이드](../BEGINNER-GUIDE.md) · [모듈 07 목차 →](07-verification-evidence/README.md)
'''
          src_path.write_text(compatibility, encoding='utf-8')

          expected = [
              module_dir / 'README.md',
              module_dir / '01-verification.md',
              module_dir / '02-evidence.md',
              module_dir / '03-evaluation-qa.md',
          ]
          for path in expected:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'[FAIL] missing/empty: {path}')

          for step, path in [
              ('step-12', module_dir / '01-verification.md'),
              ('step-13', module_dir / '02-evidence.md'),
              ('step-14', module_dir / '03-evaluation-qa.md'),
          ]:
              data = path.read_text(encoding='utf-8')
              if data.count(f'<a id="{step}"></a>') != 1:
                  raise SystemExit(f'[FAIL] anchor check: {step}')

          print('[PASS] module 07 split and structural checks complete')
          PY

      - name: Commit module 07 split and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_oneshot-split-b1-1-module-07.yml
          git add training/round-01-clear/guide/07-VERIFICATION-AND-EVIDENCE.md
          git add training/round-01-clear/guide/07-verification-evidence/README.md
          git add training/round-01-clear/guide/07-verification-evidence/01-verification.md
          git add training/round-01-clear/guide/07-verification-evidence/02-evidence.md
          git add training/round-01-clear/guide/07-verification-evidence/03-evaluation-qa.md
          git diff --cached --check
          git commit -m 'docs: split B1-1 module 07 into learning units'
          git push origin HEAD:main

# retrigger after workflow exists on default branch
