name: One-shot B1-1 Quick Start Gate patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-b1-1-quickstart-gate.yml'

permissions:
  contents: write

jobs:
  patch-quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Beginner Guide Quick Start gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('training/round-01-clear/BEGINNER-GUIDE.md')
          text = path.read_text(encoding='utf-8')

          old_intro = '''> **공통 개발환경이 이미 준비되어 있고 B1-1 저장소를 받은 학습자**가 안전하게 현재 상태를 다시 확인하는 경로입니다.\n> 처음 개발환경을 준비하는 경우에는 Control Tower의 `environments/START-HERE-DEVELOPMENT-ENVIRONMENT.md`를 먼저 완료한 뒤 돌아오세요.\n\n### 📍 실행 위치\n'''
          new_intro = '''> **공통 개발환경이 이미 준비되어 있고 B1-1 저장소를 받은 학습자**가 안전하게 현재 상태를 다시 확인하는 경로입니다.\n> 처음 개발환경을 준비하는 경우에는 Control Tower의 `environments/START-HERE-DEVELOPMENT-ENVIRONMENT.md`를 먼저 완료한 뒤 돌아오세요.\n\n### B1-1 진입 전 공통 환경 판정(Gate)\n\nQuick Start를 실행하기 전에 Control Tower에서 다음 순서를 먼저 닫습니다.\n\n```text\n1. Git/GitHub 사용자 준비 상태(User Identity Readiness) 재확인\n2. 공통 환경 마무리(Common Environment Closeout) 판정\n3. 공통 환경 동결(Common Environment Freeze) 확인\n4. 그 다음 B1-1 Quick Start → STEP 01\n```\n\n현재 운영 상태와 최종 판정은 Control Tower의 `training/round-01-clear/NEXT-ACTIONS.md`와 `environments/ubuntu/ENVIRONMENT-CLOSEOUT.md`를 기준으로 합니다.\n\nUbuntu Bash의 Control Tower root에서 사용자 상태를 읽기 전용으로 재확인합니다.\n\n```bash\ncd "$HOME/codyssey/codyssey-basic"\nbash environments/ubuntu/verify-user-identity.sh\n```\n\n결과가 현재 Git/GitHub 작업에 필요한 수준으로 준비되었는지 확인한 뒤 `ENVIRONMENT-CLOSEOUT.md`의 Gate 1~4와 동결(Freeze) 조건을 확인합니다. **공통 환경 동결이 아직 확인되지 않았다면 SSH/UFW 변경을 시작하지 않고 STOP합니다.**\n\n### 📍 실행 위치\n'''

          old_check = '''[ ] pwd가 /home/<user>/codyssey/codyssey-basic-b1-1-system-monitor 계열이다.\n[ ] 현재 Branch와 변경사항을 이해하고 있다.\n[ ] Ubuntu 24.04 Runtime이다.\n[ ] CPU Architecture를 확인했다.\n[ ] PID 1이 systemd이다.\n[ ] monitor.sh 문법 검사에 오류가 없다.\n'''
          new_check = '''[ ] Control Tower에서 공통 환경 동결(Common Environment Freeze)이 확인되었다.\n[ ] pwd가 /home/<user>/codyssey/codyssey-basic-b1-1-system-monitor 계열이다.\n[ ] 현재 Branch와 변경사항을 이해하고 있다.\n[ ] Ubuntu 24.04 Runtime이다.\n[ ] CPU Architecture를 확인했다.\n[ ] PID 1이 systemd이다.\n[ ] monitor.sh 문법 검사에 오류가 없다.\n'''

          old_go = '''✅ GO\n→ 모두 만족하면 STEP 01부터 현재 실제 Runtime 상태를 확인합니다.\n\n❌ STOP\n→ 하나라도 다르면 SSH/UFW 설정을 시작하지 않습니다.\n→ 개발환경·Repository 위치·Branch·Runtime부터 먼저 바로잡습니다.\n'''
          new_go = '''✅ GO\n→ 공통 환경 동결이 확인되고 위 항목을 모두 만족하면 STEP 01부터 현재 실제 Runtime 상태를 확인합니다.\n\n❌ STOP\n→ 공통 환경 마무리/동결이 미완료이거나 위 항목 중 하나라도 다르면 SSH/UFW 설정을 시작하지 않습니다.\n→ Control Tower 환경 Gate 또는 개발환경·Repository 위치·Branch·Runtime부터 먼저 바로잡습니다.\n'''

          for old, new, label in [
              (old_intro, new_intro, 'intro'),
              (old_check, new_check, 'normal criteria'),
              (old_go, new_go, 'go stop'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_oneshot-b1-1-quickstart-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training/round-01-clear/BEGINNER-GUIDE.md .github/workflows/_oneshot-b1-1-quickstart-gate.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs: gate B1-1 Quick Start behind common environment freeze'
          git push origin HEAD:main
