name: One-shot B1-1 beginner guide modularization

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-b1-1-guide-modularize.yml'

permissions:
  contents: write

jobs:
  modularize-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split monolithic guide into hub and modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('training/round-01-clear/BEGINNER-GUIDE.md')
          expected_blob = '0164b34494008e07d2ae4462c0142fbd51a9f46d'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'BEGINNER-GUIDE.md drift: expected {expected_blob}, got {actual_blob}')

          text = path.read_text(encoding='utf-8')

          anchors = [
              'quick-start', 'toc', 'overview',
              'step-01', 'step-02', 'step-03', 'step-04', 'step-05',
              'step-06', 'step-07', 'step-08', 'step-09', 'step-10', 'step-11',
              'step-12', 'step-13', 'step-14', 'step-15',
              'reference-files', 'secret-policy'
          ]
          for anchor in anchors:
              marker = f'<a id="{anchor}"></a>'
              if text.count(marker) != 1:
                  raise SystemExit(f'expected exactly one anchor {marker}, found {text.count(marker)}')

          def pos(anchor: str) -> int:
              return text.index(f'<a id="{anchor}"></a>')

          if not all(pos(a) < pos(b) for a, b in zip(anchors, anchors[1:])):
              raise SystemExit('anchor order is not monotonic')

          # Keep the original title/introduction/Quick Start in the hub.
          hub_intro = text[:pos('toc')].rstrip()

          # The old monolithic TOC is intentionally replaced by a module map.
          segments = {
              '00-OVERVIEW.md': text[pos('overview'):pos('step-01')].strip(),
              '01-PREFLIGHT-AND-BASELINE.md': text[pos('step-01'):pos('step-03')].strip(),
              '02-SSH-AND-FIREWALL.md': text[pos('step-03'):pos('step-05')].strip(),
              '03-USERS-GROUPS-ACL.md': text[pos('step-05'):pos('step-06')].strip(),
              '04-AGENT-RUNTIME.md': text[pos('step-06'):pos('step-08')].strip(),
              '05-MONITOR-AND-CRON.md': text[pos('step-08'):pos('step-12')].strip(),
              '06-VERIFICATION-AND-EVIDENCE.md': text[pos('step-12'):pos('step-15')].strip(),
              '07-FINAL-CLEAR.md': text[pos('step-15'):].strip(),
          }

          expected_steps = {f'step-{i:02d}' for i in range(1, 16)}
          actual_steps = set()
          for body in segments.values():
              for i in range(1, 16):
                  anchor = f'<a id="step-{i:02d}"></a>'
                  if anchor in body:
                      actual_steps.add(f'step-{i:02d}')
          if actual_steps != expected_steps:
              raise SystemExit(f'step coverage mismatch: {sorted(actual_steps)}')

          module_meta = [
              ('00-OVERVIEW.md', '00', '미션 개요와 공식 기준', '개요·공식 기준·최종 산출물·전체 실행 경로'),
              ('01-PREFLIGHT-AND-BASELINE.md', '01', '실행 전 점검과 기준 상태', 'STEP 01~02'),
              ('02-SSH-AND-FIREWALL.md', '02', 'SSH와 방화벽', 'STEP 03~04'),
              ('03-USERS-GROUPS-ACL.md', '03', '사용자·그룹·접근 제어 목록', 'STEP 05'),
              ('04-AGENT-RUNTIME.md', '04', 'Agent 준비와 실제 실행', 'STEP 06~07'),
              ('05-MONITOR-AND-CRON.md', '05', '모니터링·로그·cron', 'STEP 08~11'),
              ('06-VERIFICATION-AND-EVIDENCE.md', '06', '검증·증빙·평가 설명', 'STEP 12~14'),
              ('07-FINAL-CLEAR.md', '07', '최종 완료 판정', 'STEP 15 + Reference/Secret 원칙'),
          ]

          guide_dir = Path('training/round-01-clear/guide')
          if guide_dir.exists() and any(guide_dir.iterdir()):
              raise SystemExit('guide/ already exists and is not empty; refusing blind overwrite')
          guide_dir.mkdir(parents=True, exist_ok=True)

          def mini_toc(body: str) -> str:
              links = []
              for i in range(1, 16):
                  anchor = f'<a id="step-{i:02d}"></a>'
                  if anchor in body:
                      # Find the first heading immediately after the anchor.
                      tail = body.split(anchor, 1)[1].lstrip('\n')
                      heading = next((line.strip('# ').strip() for line in tail.splitlines() if line.startswith('#')), f'STEP {i:02d}')
                      links.append(f'- [{heading}](#step-{i:02d})')
              if not links:
                  overview_links = []
                  for anchor, label in [
                      ('overview', '00. 미션 한눈에 보기'),
                      ('source-of-truth', '01. 공식 기준(Source of Truth)'),
                      ('final-deliverables', '02. 최종적으로 만들어야 하는 것'),
                      ('runtime-path', '03. R01 실제 실행 경로(Runtime Path)'),
                  ]:
                      if f'<a id="{anchor}"></a>' in body:
                          overview_links.append(f'- [{label}](#{anchor})')
                  links = overview_links
              return '\n'.join(links)

          for idx, (filename, number, title, scope) in enumerate(module_meta):
              body = segments[filename]
              # Demote original STEP H1 headings so each module has one H1 title.
              body = body.replace('\n# STEP ', '\n## STEP ')
              if body.startswith('# STEP '):
                  body = '## STEP ' + body[len('# STEP '):]

              prev_link = '../BEGINNER-GUIDE.md' if idx == 0 else module_meta[idx-1][0]
              next_link = '../BEGINNER-GUIDE.md' if idx == len(module_meta)-1 else module_meta[idx+1][0]
              prev_label = '입문자 가이드 허브' if idx == 0 else f'모듈 {module_meta[idx-1][1]}'
              next_label = '입문자 가이드 허브' if idx == len(module_meta)-1 else f'모듈 {module_meta[idx+1][1]}'

              toc = mini_toc(body)
              header = f'''# B1-1 모듈 {number} — {title}\n\n> 범위: **{scope}**  \n> [← {prev_label}]({prev_link}) · [입문자 가이드 허브](../BEGINNER-GUIDE.md) · [다음: {next_label} →]({next_link})\n\n## 📑 이 모듈 목차\n\n{toc}\n\n---\n\n'''
              footer = f'''\n\n---\n\n## 다음 이동\n\n[← {prev_label}]({prev_link}) · [입문자 가이드 허브](../BEGINNER-GUIDE.md) · [다음: {next_label} →]({next_link})\n'''
              (guide_dir / filename).write_text(header + body + footer, encoding='utf-8')

          module_rows = '\n'.join(
              f'| {number} | {scope} | [{title}](guide/{filename}) | ⬜ 실제 실행 전/진행 중 |'
              for filename, number, title, scope in module_meta
          )

          hub = hub_intro + r'''

---

<a id="module-map"></a>
## 📚 학습 모듈 지도(Module Map)

B1-1의 상세 따라하기는 한 파일에 누적하지 않고 **기술 흐름별 학습 모듈(Module)**로 분리합니다. `BEGINNER-GUIDE.md`는 빠른 시작(Quick Start)과 전체 이동을 담당하는 **중앙 허브(Hub)**입니다.

> 문서 구조를 나눈 것만으로 실제 실행(Runtime), 검증(Verification), 증빙 자료(Evidence), 완료(CLEAR) 상태가 바뀌지는 않습니다.

### 권장 진행 순서

```text
00 개요
→ 01 실행 전 점검
→ 02 SSH/UFW
→ 03 사용자/그룹/ACL
→ 04 Agent Runtime
→ 05 Monitor/Cron
→ 06 Verification/Evidence
→ 07 Final CLEAR
```

| 모듈 | 범위 | 바로가기 | 현재 상태 |
|---:|---|---|---|
''' + module_rows + r'''

### 진행 원칙

- 처음 수행하면 `00 → 01 → ... → 07` 순서로 진행합니다.
- 이미 완료한 단계가 있어도 실제 상태를 확인하지 않고 체크하지 않습니다.
- 실패하면 다음 모듈로 넘어가지 않고 해당 STEP의 STOP/복구(Recovery) 기준을 따릅니다.
- `CHECKLIST.md`는 최종 완료 여부를 관리하고, 실제 증빙은 `evidence/`에 저장합니다.

## 🔗 핵심 문서 바로가기

- [CHECKLIST.md](CHECKLIST.md) — 실제 완료 판정 체크리스트
- [requirements-mapping.md](docs/requirements-mapping.md) — 요구사항→구현→검증→증빙 연결
- [evaluation-qa.md](docs/evaluation-qa.md) — 평가 질의응답 학습
- [Evidence Guide](evidence/README.md) — 실제 증빙 수집 기준
- [Environment](environment/README.md) — B1-1 실행 환경

## 문서 분할 무결성 원칙

이번 분할은 **내용 삭제가 아니라 구조 리팩터링(Refactoring)**입니다. 기존 STEP 01~15의 상세 본문은 `guide/` 모듈로 이동하며 공식 미션/평가 요구, 명령, STOP/GO, 복구, 재실행 안전성, Secret 보호 원칙을 그대로 유지합니다.

''' 

          path.write_text(hub, encoding='utf-8')

          # Structural verification.
          if path.stat().st_size >= 100_000:
              raise SystemExit(f'hub unexpectedly large: {path.stat().st_size} bytes')
          if '# STEP 01' in path.read_text(encoding='utf-8'):
              raise SystemExit('detailed STEP content still remains in hub')

          combined = '\n'.join((guide_dir / f).read_text(encoding='utf-8') for f, *_ in module_meta)
          for i in range(1, 16):
              anchor = f'<a id="step-{i:02d}"></a>'
              if combined.count(anchor) != 1:
                  raise SystemExit(f'{anchor} count across modules != 1')

          required_files = [f for f, *_ in module_meta]
          missing = [f for f in required_files if not (guide_dir / f).is_file()]
          if missing:
              raise SystemExit(f'missing modules: {missing}')
          PY

      - name: Verify hub and module navigation
        shell: bash
        run: |
          set -euo pipefail
          grep -q '학습 모듈 지도(Module Map)' training/round-01-clear/BEGINNER-GUIDE.md
          for f in training/round-01-clear/guide/*.md; do
            grep -q '입문자 가이드 허브' "$f"
            grep -q '다음 이동' "$f"
          done
          test "$(grep -Rho '<a id="step-[0-9][0-9]"></a>' training/round-01-clear/guide | sort -u | wc -l)" -eq 15

      - name: Commit modular guide and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training/round-01-clear/BEGINNER-GUIDE.md training/round-01-clear/guide
          git rm .github/workflows/_oneshot-b1-1-guide-modularize.yml
          git commit -m 'docs: modularize B1-1 beginner guide into focused learning units'
          git push origin HEAD:main
