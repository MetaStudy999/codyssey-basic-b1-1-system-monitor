name: One-shot split B1-1 module 04

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-split-b1-1-module-04.yml'

permissions:
  contents: write

jobs:
  split-module-04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split module 04 into learning units
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('training/round-01-clear/guide')
          source_path = root / '04-AGENT-RUNTIME.md'
          module_dir = root / '04-agent-runtime'
          readme_path = module_dir / 'README.md'
          step06_path = module_dir / '01-agent-setup.md'
          step07_path = module_dir / '02-agent-runtime.md'

          source = source_path.read_text(encoding='utf-8')
          marker06 = '<a id="step-06"></a>'
          marker07 = '<a id="step-07"></a>'

          assert source.count(marker06) == 1, 'STEP 06 anchor count must be exactly 1'
          assert source.count(marker07) == 1, 'STEP 07 anchor count must be exactly 1'
          assert not step06_path.exists(), f'{step06_path} already exists'
          assert not step07_path.exists(), f'{step07_path} already exists'

          i06 = source.index(marker06)
          i07 = source.index(marker07)
          assert i06 < i07

          step06_body = source[i06:i07].rstrip()
          while step06_body.endswith('---'):
              step06_body = step06_body[:-3].rstrip()

          step07_body = source[i07:].rstrip()
          for tail_marker in ('\n---\n\n---\n\n## 다음 이동', '\n---\n\n## 다음 이동'):
              if tail_marker in step07_body:
                  step07_body = step07_body.split(tail_marker, 1)[0].rstrip()
                  break

          step06 = f'''# B1-1 모듈 04 — STEP 06 에이전트(Agent) 준비

> [← 모듈 04 목차](README.md) · [다음: STEP 07 →](02-agent-runtime.md) · [전체 입문자 가이드](../../BEGINNER-GUIDE.md)

{step06_body}

---

## 다음 이동

[← 모듈 04 목차](README.md) · [다음: STEP 07 →](02-agent-runtime.md) · [전체 입문자 가이드](../../BEGINNER-GUIDE.md)
'''

          step07 = f'''# B1-1 모듈 04 — STEP 07 에이전트 실제 실행(Runtime Execution)

> [← STEP 06](01-agent-setup.md) · [모듈 04 목차](README.md) · [다음: 모듈 05 →](../05-monitor-log/README.md) · [전체 입문자 가이드](../../BEGINNER-GUIDE.md)

{step07_body}

---

## 다음 이동

[← STEP 06](01-agent-setup.md) · [모듈 04 목차](README.md) · [다음: 모듈 05 →](../05-monitor-log/README.md) · [전체 입문자 가이드](../../BEGINNER-GUIDE.md)
'''

          assert step06.count(marker06) == 1 and marker07 not in step06
          assert step07.count(marker07) == 1 and marker06 not in step07

          module_dir.mkdir(parents=True, exist_ok=True)
          step06_path.write_text(step06, encoding='utf-8')
          step07_path.write_text(step07, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          old06 = '[STEP 06 — Agent 압축 파일(Archive)·환경 변수·비밀정보 준비](../04-AGENT-RUNTIME.md#step-06)'
          old07 = '[STEP 07 — Agent 실제 실행(Runtime) 검증](../04-AGENT-RUNTIME.md#step-07)'
          new06 = '[STEP 06 — 에이전트(Agent) 압축 파일(Archive)·환경 변수·비밀정보 준비](01-agent-setup.md)'
          new07 = '[STEP 07 — 에이전트(Agent) 실제 실행(Runtime Execution) 검증](02-agent-runtime.md)'
          assert old06 in readme, 'README STEP 06 old link not found'
          assert old07 in readme, 'README STEP 07 old link not found'
          readme = readme.replace(old06, new06).replace(old07, new07)
          readme_path.write_text(readme, encoding='utf-8')

          compat = '''# B1-1 모듈 04 — 이전 경로 호환 안내

이 파일은 B1-1 입문자 가이드의 **3계층 정보 구조(Information Architecture, IA)** 전환 과정에서 기존 링크가 즉시 끊기지 않도록 남겨 둔 호환 경로입니다.

현재 학습 본문의 단일 기준(Source of Truth)은 다음 모듈 목차와 세부 학습 문서입니다.

- [모듈 04 — 에이전트(Agent) 준비와 실제 실행(Runtime)](04-agent-runtime/README.md)
- [STEP 06 — 에이전트 준비](04-agent-runtime/01-agent-setup.md)
- [STEP 07 — 에이전트 실제 실행(Runtime Execution)](04-agent-runtime/02-agent-runtime.md)

> 이 호환 파일에는 상세 명령·설명·검증 내용을 중복하지 않습니다. 새 학습 경로를 사용하세요.

[← 전체 입문자 가이드](../BEGINNER-GUIDE.md) · [모듈 04 목차 →](04-agent-runtime/README.md)
'''
          source_path.write_text(compat, encoding='utf-8')

          # Final structural assertions.
          assert step06_path.stat().st_size > 1000
          assert step07_path.stat().st_size > 1000
          assert marker06 not in source_path.read_text(encoding='utf-8')
          assert marker07 not in source_path.read_text(encoding='utf-8')
          assert '01-agent-setup.md' in readme_path.read_text(encoding='utf-8')
          assert '02-agent-runtime.md' in readme_path.read_text(encoding='utf-8')
          PY

      - name: Commit split and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_oneshot-split-b1-1-module-04.yml
          git add training/round-01-clear/guide/04-AGENT-RUNTIME.md
          git add training/round-01-clear/guide/04-agent-runtime/README.md
          git add training/round-01-clear/guide/04-agent-runtime/01-agent-setup.md
          git add training/round-01-clear/guide/04-agent-runtime/02-agent-runtime.md
          git diff --cached --check
          git commit -m 'docs: split B1-1 module 04 into learning units'
          git push origin HEAD:main
