name: One-shot B1-1 monitor module split

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-b1-1-split-monitor-module.yml'

permissions:
  contents: write

jobs:
  split-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split oversized module and renumber downstream modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'training/round-01-clear/BEGINNER-GUIDE.md': 'dc84ee9d7ea8032bad51ff8aca823472f39cacbe',
              'training/round-01-clear/guide/05-MONITOR-AND-CRON.md': 'c7d369ed670e97caa2696417446ea51203f033d9',
              'training/round-01-clear/guide/06-VERIFICATION-AND-EVIDENCE.md': '601cd8e594a9eb30f756442494cf98e40a1479e7',
              'training/round-01-clear/guide/07-FINAL-CLEAR.md': 'f65494215148ef1b6f1c676ac8c53149efd51857',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != blob:
                  raise SystemExit(f'drift: {path}: expected {blob}, got {actual}')

          root = Path('training/round-01-clear')
          guide = root / 'guide'
          old05 = guide / '05-MONITOR-AND-CRON.md'
          old06 = guide / '06-VERIFICATION-AND-EVIDENCE.md'
          old07 = guide / '07-FINAL-CLEAR.md'

          text05 = old05.read_text(encoding='utf-8')
          step08 = '<a id="step-08"></a>'
          step10 = '<a id="step-10"></a>'
          footer_marker = '\n---\n\n---\n\n## 다음 이동\n'
          if text05.count(step08) != 1 or text05.count(step10) != 1:
              raise SystemExit('STEP 08/10 split markers are not unique')
          if footer_marker not in text05:
              raise SystemExit('expected module footer marker missing')

          start08 = text05.index(step08)
          start10 = text05.index(step10)
          body08_09 = text05[start08:start10].rstrip() + '\n'
          body10_11 = text05[start10:]
          body10_11 = body10_11.rsplit(footer_marker, 1)[0].rstrip() + '\n'

          header05 = '''# B1-1 모듈 05 — 모니터링·로그 회전\n\n> 범위: **STEP 08~09**  \n> [← 모듈 04](04-AGENT-RUNTIME.md) · [입문자 가이드 허브](../BEGINNER-GUIDE.md) · [다음: 모듈 06 →](06-CRON-FAILURE-WARNING.md)\n\n## 📑 이 모듈 목차\n\n- [STEP 08 — monitor.sh 설치와 정상 실행](#step-08)\n- [STEP 09 — monitor.log 10MB / 총 10개 로그 회전 격리 검증](#step-09)\n\n---\n\n'''
          footer05 = '''\n---\n\n## 다음 이동\n\n[← 모듈 04](04-AGENT-RUNTIME.md) · [입문자 가이드 허브](../BEGINNER-GUIDE.md) · [다음: 모듈 06 →](06-CRON-FAILURE-WARNING.md)\n'''

          header06 = '''# B1-1 모듈 06 — cron 자동 실행·실패·경고 분기\n\n> 범위: **STEP 10~11**  \n> [← 모듈 05](05-MONITOR-AND-LOG-ROTATION.md) · [입문자 가이드 허브](../BEGINNER-GUIDE.md) · [다음: 모듈 07 →](07-VERIFICATION-AND-EVIDENCE.md)\n\n## 📑 이 모듈 목차\n\n- [STEP 10 — agent-admin cron 매분 자동 실행 검증](#step-10)\n- [STEP 11 — Health 실패와 Warning-only 분기 격리 검증](#step-11)\n\n---\n\n'''
          footer06 = '''\n---\n\n## 다음 이동\n\n[← 모듈 05](05-MONITOR-AND-LOG-ROTATION.md) · [입문자 가이드 허브](../BEGINNER-GUIDE.md) · [다음: 모듈 07 →](07-VERIFICATION-AND-EVIDENCE.md)\n'''

          new05 = guide / '05-MONITOR-AND-LOG-ROTATION.md'
          new06 = guide / '06-CRON-FAILURE-WARNING.md'
          if new05.exists() or new06.exists():
              raise SystemExit('target split files already exist')
          new05.write_text(header05 + body08_09 + footer05, encoding='utf-8')
          new06.write_text(header06 + body10_11 + footer06, encoding='utf-8')
          old05.unlink()

          text06 = old06.read_text(encoding='utf-8')
          replacements06 = [
              ('# B1-1 모듈 06 — 검증·증빙·평가 설명', '# B1-1 모듈 07 — 검증·증빙·평가 설명'),
              ('[← 모듈 05](05-MONITOR-AND-CRON.md)', '[← 모듈 06](06-CRON-FAILURE-WARNING.md)'),
              ('[다음: 모듈 07 →](07-FINAL-CLEAR.md)', '[다음: 모듈 08 →](08-FINAL-CLEAR.md)'),
          ]
          for old, new in replacements06:
              if old not in text06:
                  raise SystemExit(f'expected text missing in old module 06: {old}')
              text06 = text06.replace(old, new)
          new07 = guide / '07-VERIFICATION-AND-EVIDENCE.md'
          new07.write_text(text06, encoding='utf-8')
          old06.unlink()

          text07 = old07.read_text(encoding='utf-8')
          replacements07 = [
              ('# B1-1 모듈 07 — 최종 완료 판정', '# B1-1 모듈 08 — 최종 완료 판정'),
              ('[← 모듈 06](06-VERIFICATION-AND-EVIDENCE.md)', '[← 모듈 07](07-VERIFICATION-AND-EVIDENCE.md)'),
          ]
          for old, new in replacements07:
              if old not in text07:
                  raise SystemExit(f'expected text missing in old module 07: {old}')
              text07 = text07.replace(old, new)
          new08 = guide / '08-FINAL-CLEAR.md'
          new08.write_text(text07, encoding='utf-8')
          old07.unlink()

          hub = root / 'BEGINNER-GUIDE.md'
          hub_text = hub.read_text(encoding='utf-8')
          old_flow = '''00 개요\n→ 01 실행 전 점검\n→ 02 SSH/UFW\n→ 03 사용자/그룹/ACL\n→ 04 Agent Runtime\n→ 05 Monitor/Cron\n→ 06 Verification/Evidence\n→ 07 Final CLEAR'''
          new_flow = '''00 개요\n→ 01 실행 전 점검\n→ 02 SSH/UFW\n→ 03 사용자/그룹/ACL\n→ 04 Agent Runtime\n→ 05 Monitor/Log Rotation\n→ 06 cron/Failure/Warning\n→ 07 Verification/Evidence\n→ 08 Final CLEAR'''
          if old_flow not in hub_text:
              raise SystemExit('hub module flow block missing')
          hub_text = hub_text.replace(old_flow, new_flow, 1)

          old_rows = '''| 05 | STEP 08~11 | [모니터링·로그·cron](guide/05-MONITOR-AND-CRON.md) | ⬜ 실제 실행 전/진행 중 |\n| 06 | STEP 12~14 | [검증·증빙·평가 설명](guide/06-VERIFICATION-AND-EVIDENCE.md) | ⬜ 실제 실행 전/진행 중 |\n| 07 | STEP 15 + Reference/Secret 원칙 | [최종 완료 판정](guide/07-FINAL-CLEAR.md) | ⬜ 실제 실행 전/진행 중 |'''
          new_rows = '''| 05 | STEP 08~09 | [모니터링·로그 회전](guide/05-MONITOR-AND-LOG-ROTATION.md) | ⬜ 실제 실행 전/진행 중 |\n| 06 | STEP 10~11 | [cron 자동 실행·실패·경고 분기](guide/06-CRON-FAILURE-WARNING.md) | ⬜ 실제 실행 전/진행 중 |\n| 07 | STEP 12~14 | [검증·증빙·평가 설명](guide/07-VERIFICATION-AND-EVIDENCE.md) | ⬜ 실제 실행 전/진행 중 |\n| 08 | STEP 15 + Reference/Secret 원칙 | [최종 완료 판정](guide/08-FINAL-CLEAR.md) | ⬜ 실제 실행 전/진행 중 |'''
          if old_rows not in hub_text:
              raise SystemExit('hub module table rows missing')
          hub_text = hub_text.replace(old_rows, new_rows, 1)
          hub_text = hub_text.replace('처음 수행하면 `00 → 01 → ... → 07` 순서로 진행합니다.', '처음 수행하면 `00 → 01 → ... → 08` 순서로 진행합니다.', 1)
          hub.write_text(hub_text, encoding='utf-8')

          expected_files = [
              '00-OVERVIEW.md',
              '01-PREFLIGHT-AND-BASELINE.md',
              '02-SSH-AND-FIREWALL.md',
              '03-USERS-GROUPS-ACL.md',
              '04-AGENT-RUNTIME.md',
              '05-MONITOR-AND-LOG-ROTATION.md',
              '06-CRON-FAILURE-WARNING.md',
              '07-VERIFICATION-AND-EVIDENCE.md',
              '08-FINAL-CLEAR.md',
          ]
          actual_files = sorted(p.name for p in guide.glob('*.md'))
          if actual_files != expected_files:
              raise SystemExit(f'unexpected guide files: {actual_files}')

          combined = '\n'.join((guide / name).read_text(encoding='utf-8') for name in expected_files)
          for n in range(1, 16):
              marker = f'<a id="step-{n:02d}"></a>'
              count = combined.count(marker)
              if count != 1:
                  raise SystemExit(f'{marker} count={count}, expected 1')

          sizes = {name: (guide / name).stat().st_size for name in expected_files}
          print('[PASS] STEP 01~15 anchors are unique across modules')
          for name in expected_files:
              print(f'[INFO] {name}: {sizes[name]} bytes')
          PY

      - name: Commit refactor and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training/round-01-clear/BEGINNER-GUIDE.md training/round-01-clear/guide
          git rm .github/workflows/_oneshot-b1-1-split-monitor-module.yml
          git commit -m 'docs: split B1-1 monitor and cron learning modules'
          git push origin HEAD:main
